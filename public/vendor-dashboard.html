<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard - GlobalMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Sidebar -->
        <div class="flex">
            <div class="w-64 bg-white shadow-lg p-6 min-h-screen">
                <h1 class="text-2xl font-bold text-blue-600 mb-8">GlobalMart</h1>
                <nav class="space-y-4">
                    <button onclick="showSection('stats')"
                        class="w-full text-left px-4 py-2 rounded hover:bg-blue-50 font-medium">📊 Dashboard</button>
                    <button onclick="showSection('products')"
                        class="w-full text-left px-4 py-2 rounded hover:bg-blue-50">📦 My Products</button>
                    <button onclick="showSection('orders')"
                        class="w-full text-left px-4 py-2 rounded hover:bg-blue-50">📋 Orders</button>
                    <button onclick="logout()"
                        class="w-full text-left px-4 py-2 rounded hover:bg-red-50 text-red-600">🚪 Logout</button>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="flex-1 p-8">
                <!-- Login Form -->
                <div id="login-section" class="max-w-md mx-auto mt-20">
                    <div class="bg-white p-8 rounded-lg shadow-lg">
                        <h2 class="text-2xl font-bold mb-6">Vendor Login</h2>
                        <input type="email" id="vendor-email" placeholder="Email" required
                            class="w-full px-4 py-2 border rounded mb-4">
                        <input type="password" id="vendor-password" placeholder="Password" required
                            class="w-full px-4 py-2 border rounded mb-4">
                        <button onclick="vendorLogin()"
                            class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700">Login</button>
                        <p class="text-sm text-gray-600 mt-4">No account? <button onclick="toggleRegister()"
                                class="text-blue-600 hover:underline">Register</button></p>
                    </div>

                    <div id="register-form" class="hidden bg-white p-8 rounded-lg shadow-lg mt-4">
                        <h2 class="text-2xl font-bold mb-6">Vendor Registration</h2>
                        <input type="text" id="vendor-fullname" placeholder="Full Name" required
                            class="w-full px-4 py-2 border rounded mb-4">
                        <input type="text" id="vendor-business" placeholder="Business Name" required
                            class="w-full px-4 py-2 border rounded mb-4">
                        <input type="email" id="vendor-email-reg" placeholder="Email" required
                            class="w-full px-4 py-2 border rounded mb-4">
                        <input type="password" id="vendor-password-reg" placeholder="Password" required
                            class="w-full px-4 py-2 border rounded mb-4">
                        <button onclick="vendorRegister()"
                            class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700">Register</button>
                    </div>
                </div>

                <!-- Dashboard (hidden until login) -->
                <div id="dashboard" class="hidden">
                    <!-- Stats Section -->
                    <div id="stats" class="hidden">
                        <h2 class="text-3xl font-bold mb-8">Dashboard</h2>
                        <div class="grid grid-cols-3 gap-6 mb-8">
                            <div class="bg-white p-6 rounded-lg shadow">
                                <p class="text-gray-600 text-sm">Products</p>
                                <p class="text-3xl font-bold" id="stat-products">0</p>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <p class="text-gray-600 text-sm">Orders</p>
                                <p class="text-3xl font-bold" id="stat-orders">0</p>
                            </div>
                            <div class="bg-white p-6 rounded-lg shadow">
                                <p class="text-gray-600 text-sm">Revenue</p>
                                <p class="text-3xl font-bold" id="stat-revenue">0 CFA</p>
                            </div>
                        </div>

                        <!-- Recent Orders -->
                        <div class="bg-white p-6 rounded-lg shadow">
                            <h3 class="text-xl font-bold mb-4">Recent Orders</h3>
                            <div id="orders-list" class="space-y-4">Loading...</div>
                        </div>
                    </div>

                    <!-- Products Section -->
                    <div id="products" class="hidden">
                        <div class="flex justify-between items-center mb-8">
                            <h2 class="text-3xl font-bold">My Products</h2>
                            <button onclick="showAddProduct()"
                                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">+ Add
                                Product</button>
                        </div>

                        <!-- Add/Edit Product Form -->
                        <div id="product-form" class="hidden bg-white p-6 rounded-lg shadow mb-8">
                            <h3 class="text-xl font-bold mb-4">Add New Product</h3>
                            <input type="text" id="product-name" placeholder="Product Name"
                                class="w-full px-4 py-2 border rounded mb-4">
                            <input type="text" id="product-description" placeholder="Description"
                                class="w-full px-4 py-2 border rounded mb-4">
                            <input type="number" id="product-price" placeholder="Price (CFA)"
                                class="w-full px-4 py-2 border rounded mb-4">
                            <select id="product-category" class="w-full px-4 py-2 border rounded mb-4">
                                <option value="consoles">Consoles</option>
                                <option value="android">Android Phones</option>
                                <option value="iphone">iPhone</option>
                                <option value="cases">Cases</option>
                            </select>
                            <input type="text" id="product-image" placeholder="Image URL"
                                class="w-full px-4 py-2 border rounded mb-4">
                            <button onclick="saveProduct()"
                                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Save
                                Product</button>
                        </div>

                        <!-- Products List -->
                        <div id="products-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            Loading products...
                        </div>
                    </div>

                    <!-- Orders Section -->
                    <div id="orders" class="hidden">
                        <h2 class="text-3xl font-bold mb-8">Orders</h2>
                        <div id="vendor-orders-list" class="bg-white p-6 rounded-lg shadow">
                            Loading orders...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentVendor = null;
        const API_URL = window.location.origin;

        function authHeaders(json = false) {
            const token = localStorage.getItem('vendor-token');
            const headers = {};
            if (json) headers['Content-Type'] = 'application/json';
            if (token) headers['Authorization'] = `Bearer ${token}`;
            return headers;
        }

        async function readJson(res) {
            const text = await res.text();
            try {
                return text ? JSON.parse(text) : {};
            } catch {
                return { message: text || `Server returned ${res.status}` };
            }
        }

        function showSection(section) {
            document.querySelectorAll('#stats, #products, #orders').forEach(el => el.classList.add('hidden'));
            document.getElementById(section)?.classList.remove('hidden');
            if (section === 'stats') loadStats();
            if (section === 'products') loadProducts();
            if (section === 'orders') loadOrders();
        }

        async function vendorLogin() {
            const email = document.getElementById('vendor-email').value;
            const password = document.getElementById('vendor-password').value;

            try {
                const res = await fetch(`${API_URL}/api/vendor/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await readJson(res);
                if (!res.ok) {
                    throw new Error(data.message || `Request failed (${res.status})`);
                }
                if (data.token) {
                    localStorage.setItem('vendor-token', data.token);
                    currentVendor = data.vendor;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    showSection('stats');
                } else {
                    alert(data.message || 'Login failed');
                }
            } catch (err) {
                alert('Login error: ' + err.message);
            }
        }

        async function vendorRegister() {
            const fullName = document.getElementById('vendor-fullname').value;
            const businessName = document.getElementById('vendor-business').value;
            const email = document.getElementById('vendor-email-reg').value;
            const password = document.getElementById('vendor-password-reg').value;

            try {
                const res = await fetch(`${API_URL}/api/vendor/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, businessName, email, password })
                });
                const data = await readJson(res);
                if (!res.ok) {
                    throw new Error(data.message || `Request failed (${res.status})`);
                }
                if (data.token) {
                    localStorage.setItem('vendor-token', data.token);
                    currentVendor = data.vendor;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    showSection('stats');
                } else {
                    alert(data.message || 'Registration failed');
                }
            } catch (err) {
                alert('Registration error: ' + err.message);
            }
        }

        async function loadStats() {
            const token = localStorage.getItem('vendor-token');
            try {
                const res = await fetch(`${API_URL}/api/vendor/stats`, {
                    headers: authHeaders()
                });
                const data = await readJson(res);
                if (!res.ok) throw new Error(data.message || `Request failed (${res.status})`);
                document.getElementById('stat-products').textContent = data.productCount || 0;
                document.getElementById('stat-orders').textContent = data.orderCount || 0;
                document.getElementById('stat-revenue').textContent = (data.totalRevenue || 0).toLocaleString() + ' CFA';

                const ordersList = (data.orders || []).map(o => `
                    <div class="p-4 bg-gray-50 rounded">
                        <p class="font-medium">${o.customerName}</p>
                        <p class="text-sm text-gray-600">${Number(o.totalAmount || 0).toLocaleString()} CFA - ${o.status}</p>
                        <p class="text-xs text-gray-500">${new Date(o.createdAt).toLocaleDateString()}</p>
                    </div>
                `).join('');
                document.getElementById('orders-list').innerHTML = ordersList || '<p class="text-gray-500">No orders yet</p>';
            } catch (err) {
                console.error('Stats error:', err);
            }
        }

        async function loadProducts() {
            const token = localStorage.getItem('vendor-token');
            try {
                const res = await fetch(`${API_URL}/api/vendor/products`, {
                    headers: authHeaders()
                });
                const products = await readJson(res);
                if (!res.ok) throw new Error(products.message || `Request failed (${res.status})`);
                const html = (products || []).map(p => `
    <div class="bg-white p-4 rounded-lg shadow" data-id="${p.id}" data-name="${p.name}" data-description="${p.description}" data-price="${p.price}" data-category="${p.category}" data-image="${p.image}">
        <img src="${p.image}" alt="${p.name}" class="w-full h-40 object-cover rounded mb-2">
        <h4 class="font-bold">${p.name}</h4>
        <p class="text-sm text-gray-600">${Number(p.price || 0).toLocaleString()} CFA</p>
        <button onclick="editProduct('${p.id}')" class="mt-2 w-full bg-blue-600 text-white py-1 rounded text-sm">Edit</button>
        <button onclick="deleteProduct('${p.id}')" class="mt-1 w-full bg-red-600 text-white py-1 rounded text-sm">Delete</button>
    </div>
`).join('');
                document.getElementById('products-list').innerHTML = html || '<p>No products yet</p>';
            } catch (err) {
                console.error('Products error:', err);
            }
        }

        async function loadOrders() {
            // Same as loadStats but focused on orders
            loadStats();
            const token = localStorage.getItem('vendor-token');
            try {
                const res = await fetch(`${API_URL}/api/vendor/stats`, {
                    headers: authHeaders()
                });
                const data = await readJson(res);
                if (!res.ok) throw new Error(data.message || `Request failed (${res.status})`);
                const html = (data.orders || []).map(o => `
                    <div class="p-4 bg-gray-50 rounded mb-2">
                        <p class="font-bold">Order #${o.id}</p>
                        <p>${o.customerName} - ${Number(o.totalAmount || 0).toLocaleString()} CFA</p>
                        <p class="text-sm text-gray-600">Status: ${o.status}</p>
                    </div>
                `).join('');
                document.getElementById('vendor-orders-list').innerHTML = html || '<p>No orders</p>';
            } catch (err) {
                console.error('Orders error:', err);
            }
        }

        function showAddProduct() {
            document.getElementById('product-form').classList.toggle('hidden');
        }

        async function saveProduct() {
            const token = localStorage.getItem('vendor-token');
            const editId = document.getElementById('product-form').dataset.editId;

            const product = {
                name: document.getElementById('product-name').value,
                description: document.getElementById('product-description').value,
                price: parseInt(document.getElementById('product-price').value),
                category: document.getElementById('product-category').value,
                image: document.getElementById('product-image').value
            };

            try {
                const method = editId ? 'PUT' : 'POST';
                const url = editId ? `/api/vendor/products/${editId}` : '/api/vendor/products';

                const res = await fetch(`${API_URL}${url}`, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(product)
                });
                const data = await readJson(res);
                if (!res.ok) {
                    throw new Error(data.message || `Request failed (${res.status})`);
                }
                if (data.success) {
                    alert(editId ? 'Product updated!' : 'Product added!');
                    document.getElementById('product-form').classList.add('hidden');
                    document.getElementById('product-form').dataset.editId = '';
                    loadProducts();
                    // Clear form
                    document.getElementById('product-name').value = '';
                    document.getElementById('product-description').value = '';
                    document.getElementById('product-price').value = '';
                    document.getElementById('product-category').selectedIndex = 0;
                    document.getElementById('product-image').value = '';
                } else {
                    alert(data.message || 'Failed to save');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
        function editProduct(id) {
            const product = document.querySelector(`[data-id="${id}"]`);
            if (!product) return;

            document.getElementById('product-name').value = product.dataset.name;
            document.getElementById('product-description').value = product.dataset.description;
            document.getElementById('product-price').value = product.dataset.price;
            document.getElementById('product-category').value = product.dataset.category;
            document.getElementById('product-image').value = product.dataset.image;
            document.getElementById('product-form').dataset.editId = id;
            document.getElementById('product-form').classList.remove('hidden');
        }


        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            const token = localStorage.getItem('vendor-token');
            try {
                const res = await fetch(`${API_URL}/api/vendor/products/${id}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                const data = await readJson(res);
                if (!res.ok) {
                    throw new Error(data.message || `Request failed (${res.status})`);
                }
                if (data.success) {
                    loadProducts();
                } else {
                    alert(data.message || 'Failed to delete');
                }
            } catch (err) {
                alert('Delete error: ' + err.message);
            }
        }

        function toggleRegister() {
            document.getElementById('register-form').classList.toggle('hidden');
        }

        function logout() {
            localStorage.removeItem('vendor-token');
            location.reload();
        }

        // Check if already logged in
        window.addEventListener('load', () => {
            const token = localStorage.getItem('vendor-token');
            if (token) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                showSection('stats');
            }
        });
    </script>
</body>

</html>
